<div class="overlay" (click)="cancel.emit()">
  <div class="dialog modal-card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <div class="dialog-icon" [class.danger-icon]="danger">
      @if (danger) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4"/>
          <path d="M12 8h.01"/>
        </svg>
      }
    </div>
    <h2 class="dialog-title">{{ title }}</h2>
    <p class="dialog-message">{{ message }}</p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" (click)="cancel.emit()">{{ cancelLabel }}</button>
      <button type="button"
        class="btn"
        [class.btn-danger]="danger"
        [class.btn-primary]="!danger"
        (click)="confirm.emit()"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
